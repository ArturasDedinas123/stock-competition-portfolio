name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint the package and tests
        run: pylint stock_competition tests

      - name: Lint the notebooks
        run: nbqa pylint notebooks

      - name: Type-check the package and tests
        run: pyright stock_competition tests

      - name: Test
        run: pytest
